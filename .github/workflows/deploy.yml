name: Deploy

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      sitrust-backend: ${{ steps.filter.outputs.sitrust-backend }}
      sitrust-frontend: ${{ steps.filter.outputs.sitrust-frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            sitrust-backend:
              - 'sitrust-mock/backend/**'
            sitrust-frontend:
              - 'sitrust-mock/frontend/**'

  build-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet build ePrevzem.sln
      - run: dotnet test backend/ePrevzem.Tests
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: edvbec/eprevzem-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: edvbec/eprevzem-frontend:latest
          build-args: |
            VITE_API_URL=
            VITE_SIPASS_URL=${{ secrets.VITE_SIPASS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-sitrust-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.sitrust-backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet build sitrust-mock/sitrust-mock.sln
      - run: dotnet test sitrust-mock/backend/SiTrustMock.Tests
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: sitrust-mock
          file: sitrust-mock/backend/Dockerfile
          push: true
          tags: edvbec/eprevzem-sitrust-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-sitrust-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.sitrust-frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sitrust-mock/frontend/package-lock.json
      - run: npm ci
        working-directory: sitrust-mock/frontend
      - run: npm run lint
        working-directory: sitrust-mock/frontend
      - run: npm run build
        working-directory: sitrust-mock/frontend
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: sitrust-mock/frontend
          file: sitrust-mock/frontend/Dockerfile
          push: true
          tags: edvbec/eprevzem-sitrust-frontend:latest
          build-args: |
            VITE_API_BASE_URL=
            VITE_EPREVZEM_URL=${{ secrets.VITE_EPREVZEM_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-backend, build-frontend, build-sitrust-backend, build-sitrust-frontend]
    if: always() && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure')
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/eprevzem
            SERVICES=""
            [ "$BACKEND" = "true" ] && SERVICES="$SERVICES backend"
            [ "$FRONTEND" = "true" ] && SERVICES="$SERVICES frontend"
            [ "$SITRUST_BACKEND" = "true" ] && SERVICES="$SERVICES sitrust-backend"
            [ "$SITRUST_FRONTEND" = "true" ] && SERVICES="$SERVICES sitrust-frontend"
            docker compose pull $SERVICES
            docker compose up -d --no-deps $SERVICES
          envs: BACKEND,FRONTEND,SITRUST_BACKEND,SITRUST_FRONTEND
        env:
          BACKEND: ${{ needs.build-backend.result == 'success' && 'true' || 'false' }}
          FRONTEND: ${{ needs.build-frontend.result == 'success' && 'true' || 'false' }}
          SITRUST_BACKEND: ${{ needs.build-sitrust-backend.result == 'success' && 'true' || 'false' }}
          SITRUST_FRONTEND: ${{ needs.build-sitrust-frontend.result == 'success' && 'true' || 'false' }}
