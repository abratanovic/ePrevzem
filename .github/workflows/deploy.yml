name: Deploy

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      sitrust-backend: ${{ steps.filter.outputs.sitrust-backend }}
      sitrust-frontend: ${{ steps.filter.outputs.sitrust-frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            sitrust-backend:
              - 'sitrust-mock/backend/**'
            sitrust-frontend:
              - 'sitrust-mock/frontend/**'

  build-and-push:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: needs.detect-changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: edvbec/eprevzem-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: edvbec/eprevzem-frontend:latest
          build-args: |
            VITE_API_URL=
            VITE_SIPASS_URL=${{ secrets.VITE_SIPASS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sitrust-backend
        if: needs.detect-changes.outputs.sitrust-backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: sitrust-mock
          file: sitrust-mock/backend/Dockerfile
          push: true
          tags: edvbec/eprevzem-sitrust-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sitrust-frontend
        if: needs.detect-changes.outputs.sitrust-frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: sitrust-mock/frontend
          file: sitrust-mock/frontend/Dockerfile
          push: true
          tags: edvbec/eprevzem-sitrust-frontend:latest
          build-args: |
            VITE_API_BASE_URL=
            VITE_EPREVZEM_URL=${{ secrets.VITE_EPREVZEM_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/eprevzem
            SERVICES=""
            ${{ needs.detect-changes.outputs.backend == 'true' && 'SERVICES="$SERVICES backend"' || '' }}
            ${{ needs.detect-changes.outputs.frontend == 'true' && 'SERVICES="$SERVICES frontend"' || '' }}
            ${{ needs.detect-changes.outputs.sitrust-backend == 'true' && 'SERVICES="$SERVICES sitrust-backend"' || '' }}
            ${{ needs.detect-changes.outputs.sitrust-frontend == 'true' && 'SERVICES="$SERVICES sitrust-frontend"' || '' }}
            docker compose pull $SERVICES
            docker compose up -d --no-deps $SERVICES
