name: cv-identity-build
"on":
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  build:
    name: cv-identity-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cv-identity:
              - "cv-identity/**"
              - ".github/workflows/cv-identity.yml"
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.cv-identity == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cv-identity/requirements.txt
      - if: steps.changes.outputs.cv-identity == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 tesseract-ocr tesseract-ocr-eng tesseract-ocr-hrv tesseract-ocr-slv
      - if: steps.changes.outputs.cv-identity == 'true'
        working-directory: cv-identity
        run: pip install -r requirements.txt
      - if: steps.changes.outputs.cv-identity == 'true'
        working-directory: cv-identity
        run: PYTHONPATH=. pytest -q
