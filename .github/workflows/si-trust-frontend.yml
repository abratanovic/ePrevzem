name: si-trust-frontend-build
"on":
  pull_request:
jobs:
  build:
    name: si-trust-frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - "sitrust-mock/frontend/**"
              - ".github/workflows/si-trust-frontend.yml"
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sitrust-mock/frontend/package-lock.json
      - if: steps.changes.outputs.frontend == 'true'
        working-directory: sitrust-mock/frontend
        run: npm ci
      - if: steps.changes.outputs.frontend == 'true'
        working-directory: sitrust-mock/frontend
        run: npm run lint
      - if: steps.changes.outputs.frontend == 'true'
        working-directory: sitrust-mock/frontend
        run: npm run build
