name: backend-build
"on":
  pull_request:
    paths:
      - "backend/**"
      - "ePrevzem.sln"
      - ".github/workflows/backend.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet build ePrevzem.sln
      - run: dotnet test backend/ePrevzem.Tests
