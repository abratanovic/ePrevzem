name: mobile-build
"on":
  pull_request:
    paths:
      - "ePrevzemMobile/**"
      - ".github/workflows/mobile.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ePrevzemMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :composeApp:compileCommonMainKotlinMetadata :composeApp:testDebugUnitTest
