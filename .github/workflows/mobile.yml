name: mobile-build
"on":
  pull_request:
jobs:
  build:
    name: mobile-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mobile:
              - "ePrevzemMobile/**"
              - ".github/workflows/mobile.yml"
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.mobile == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        if: steps.changes.outputs.mobile == 'true'
      - if: steps.changes.outputs.mobile == 'true'
        working-directory: ePrevzemMobile
        run: ./gradlew :composeApp:compileCommonMainKotlinMetadata :composeApp:testDebugUnitTest
